<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Duel</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%;
               background: #26331b;
               display: flex; align-items: center; justify-content: center;
               -webkit-user-select: none; user-select: none;
               -webkit-tap-highlight-color: transparent;
               cursor: none; }
  * { cursor: none !important; }
  #jeu { display: block; outline: none; }
  #err { position: fixed; left: 0; right: 0; top: 0; z-index: 9;
         background: #300; color: #fca; font: 12px ui-monospace, monospace;
         padding: 8px; white-space: pre-wrap; display: none; }
  #aide { position: fixed; left: 50%; transform: translateX(-50%);
          bottom: 14px; z-index: 8;
          background: rgba(0, 0, 0, 0.42);
          color: rgba(255, 255, 255, 0.88);
          font: 14px system-ui, -apple-system, sans-serif;
          padding: 8px 16px; border-radius: 999px;
          white-space: nowrap; pointer-events: none;
          backdrop-filter: blur(4px); }
  #aide b { color: #fff; font-weight: 600; }
  #retour { position: fixed; left: 14px; top: 12px; z-index: 8;
            color: rgba(255, 255, 255, 0.65);
            font: 14px system-ui, sans-serif; text-decoration: none;
            background: rgba(0, 0, 0, 0.35);
            padding: 6px 12px; border-radius: 999px; }
  @media (max-width: 640px) {
  #aide { position: fixed; left: 50%; transform: translateX(-50%);
          top: 12px; z-index: 8;
          background: rgba(0, 0, 0, 0.42);
          color: rgba(255, 255, 255, 0.88);
          font: 14px system-ui, -apple-system, sans-serif;
          padding: 8px 16px; border-radius: 999px;
          white-space: nowrap; pointer-events: none;
          backdrop-filter: blur(4px); }
  }
</style>
</head>
<body>
<pre id="err"></pre>
<a id="retour" href="../">← retour</a>
<canvas id="jeu" tabindex="0" autofocus></canvas>
<div id="aide">
  Déplacement <b>ZQSD</b> ou <b>flèches</b> &nbsp;·&nbsp;
  Recharger <b>R</b> &nbsp;·&nbsp;
  Viser et tirer à la <b>souris</b>
</div>
<script>
  const zoneErr = document.getElementById('err');
  function montreErr(t) {
    zoneErr.style.display = 'block';
    zoneErr.textContent += t + '\n';
  }
  window.montreErr = montreErr;
  window.onerror = (msg, src, l) => montreErr('ERREUR ligne ' + l + ' : ' + msg);
  (async () => {
    const f = ['config', 'moteur', 'observation', 'cerveau',
               'rendu', 'poids', 'main'];
    for (const n of f) {
      let txt;
      try {
        const r = await fetch('js/' + n + '.js');
        if (!r.ok) { montreErr(n + '.js : HTTP ' + r.status); return; }
        txt = await r.text();
      } catch (e) { montreErr(n + '.js : ' + e.message); return; }
      // certains serveurs repondent 200 avec une page HTML quand le
      // fichier n'existe pas : sans ce controle on injecterait du HTML
      if (/^\s*</.test(txt)) {
        montreErr(n + '.js : FICHIER ABSENT (le serveur a renvoye du HTML)');
        return;
      }
      const el = document.createElement('script');
      el.textContent = txt;
      document.body.appendChild(el);
    }
    document.getElementById('jeu').focus({ preventScroll: true });
  })();
</script>
</body>
</html>

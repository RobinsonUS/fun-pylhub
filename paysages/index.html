<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paysages</title>
<style>
  body { margin: 0; padding: 16px; font: 16px system-ui, -apple-system, sans-serif; }
  #vue { display: block; width: 100%; max-width: 512px; image-rendering: pixelated; }
  .ligne { display: flex; align-items: center; gap: 10px;
           margin-top: 10px; max-width: 512px; flex-wrap: wrap; }
  .ligne > span { min-width: 70px; }
  input[type=range] { flex: 1; min-width: 120px; }
  select, input[type=number] { font: inherit; padding: 8px; min-height: 40px; }
  input[type=number] { width: 140px; }
  button { font: inherit; padding: 10px 16px; min-height: 44px;
           touch-action: manipulation; }
  button:disabled { opacity: .35; }
  #etat { margin-top: 10px; font-variant-numeric: tabular-nums; min-height: 1.4em; }
  #choix { display: none; gap: 6px; flex-wrap: wrap; max-width: 512px; margin-top: 10px; }
  #choix canvas { width: 80px; height: 80px; image-rendering: pixelated;
                  border: 2px solid transparent; }
  #choix canvas:active { border-color: #f5c451; }
</style>
</head>
<body>

<canvas id="vue"></canvas>
<div id="choix"></div>

<div class="ligne">
  <label><input type="checkbox" id="multi"> choisir parmi 5</label>
</div>

<div class="ligne">
  <span>Thème</span>
  <select id="theme">
    <option value="aucun" selected>aucun</option>
    <option value="foret">forêt</option>
    <option value="montagne">montagne</option>
    <option value="desert">désert</option>
    <option value="ocean">océan</option>
    <option value="coucher">coucher de soleil</option>
    <option value="neige">neige</option>
    <option value="nuit">nuit</option>
    <option value="prairie">prairie</option>
  </select>
</div>

<div class="ligne">
  <span>Influence</span>
  <input type="range" id="influence" min="0" max="100" value="30">
  <output id="influenceVal">30</output>
</div>

<div class="ligne">
  <span>Étapes</span>
  <input type="range" id="etapes" min="10" max="200" value="50">
  <output id="etapesVal">50</output>
</div>

<div class="ligne">
  <span>Graine</span>
  <input type="number" id="graine" placeholder="aléatoire">
  <button id="de">Dé</button>
</div>

<div class="ligne">
  <button id="go">Générer</button>
  <button id="pause">Reprendre</button>
</div>

<div class="ligne">
  <button id="up" disabled>Agrandir ×4</button>
  <button id="save" disabled>Enregistrer</button>
</div>

<div id="etat">chargement...</div>

<script src="js/poids.js"></script>
<script src="js/gpu.js"></script>
<script src="js/couches.js"></script>
<script src="js/echantillon.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const vue = $('vue'), ctx = vue.getContext('2d');
const etat = $('etat'), zoneChoix = $('choix');

let hors, hctx;
let S = 128;
let session = null;
let derniere = null, dernH = 128, dernW = 128;
let enCours = false, enPause = false, annule = false;
let agrandie = false;

const SEC = 3.3;
const APERCU = 3;        // etapes generees pour chaque candidat
const T_REPRISE = 400;   // instant de rebruitage lors d'une reprise
const FORCE_MAX = 1.0;

// ---------- affichage ----------
function dessine(tab, H, W, plage) {
  if (hors.width !== W || hors.height !== H) { hors.width = W; hors.height = H; }
  const img = hctx.createImageData(W, H);
  const hw = H * W;
  const a = (plage === 'unite') ? 255 : 127.5;
  const b = (plage === 'unite') ? 0 : 127.5;
  for (let i = 0; i < hw; i++) {
    img.data[i * 4]     = tab[i] * a + b;
    img.data[i * 4 + 1] = tab[hw + i] * a + b;
    img.data[i * 4 + 2] = tab[2 * hw + i] * a + b;
    img.data[i * 4 + 3] = 255;
  }
  hctx.putImageData(img, 0, 0);
  const larg = vue.clientWidth;
  const haut = Math.round(larg * H / W);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  vue.width = Math.round(larg * dpr);
  vue.height = Math.round(haut * dpr);
  vue.style.height = haut + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(hors, 0, 0, larg, haut);
}

function attendreImage() { return new Promise(r => requestAnimationFrame(r)); }

function majBoutons() {
  const occupe = enCours && !enPause;
  $('go').disabled = false;
  $('theme').disabled = occupe;
  $('multi').disabled = occupe;
  $('graine').disabled = occupe;
  $('de').disabled = occupe;
  $('influence').disabled = occupe;

  $('pause').textContent = occupe ? 'Pause' : 'Reprendre';
  $('pause').disabled = agrandie || !derniere;

  $('up').disabled   = enCours || !derniere || agrandie;
  $('save').disabled = enCours || !derniere;
}

// ---------- boucle ----------
async function derouler(s, etiquette) {
  enCours = true; enPause = false; agrandie = false;
  majBoutons();
  const t0 = performance.now();

  while (!sessionFinie(s) && !annule) {
    if (enPause) { await attendreImage(); continue; }
    const x0 = await pasSession(s);
    derniere = x0; dernH = s.H; dernW = s.W;
    dessine(x0, s.H, s.W, 'signe');
    etat.textContent = (etiquette ? etiquette + '  ' : '') +
      'etape ' + s.i + ' / ' + s.suite.length +
      '   t=' + s.suite[Math.min(s.i, s.suite.length - 1)] +
      '   ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s' +
      '   graine ' + s.graine;
    await attendreImage();
  }

  enCours = false; enPause = false;
  majBoutons();
  if (sessionFinie(s) && !annule)
    etat.textContent = 'termine en ' + ((performance.now() - t0) / 1000).toFixed(1) +
                       ' s   graine ' + s.graine;
  annule = false;
}

// ---------- candidats ----------
async function phaseCandidats(opts) {
  zoneChoix.style.display = 'flex';
  zoneChoix.innerHTML = '';
  const sessions = [], toiles = [];
  let choisi = null, resoudre;
  const attente = new Promise(r => { resoudre = r; });

  const peint = (k, tab) => {
    toiles[k].getContext('2d').putImageData(
      new ImageData(versPixels(tab, opts.H, opts.W), opts.W, opts.H), 0, 0);
  };

  for (let k = 0; k < 5; k++) {
    const c = document.createElement('canvas');
    c.width = opts.W; c.height = opts.H;
    c.onclick = () => {
      if (choisi !== null) return;
      choisi = k;
      zoneChoix.style.display = 'none';
      zoneChoix.innerHTML = '';
      resoudre(sessions[k]);
    };
    zoneChoix.appendChild(c);
    toiles.push(c);
    sessions.push(creeSession({ ...opts, graine: (Math.random() * 1e9) | 0 }));
  }

  // on affiche le bruit de depart : les vignettes sont cliquables tout de suite
  for (let k = 0; k < 5; k++) peint(k, sessions[k].x);
  etat.textContent = 'apercus — touche une image quand tu veux';

  (async () => {
    for (let pas = 0; pas < APERCU; pas++) {
      for (let k = 0; k < 5; k++) {
        if (choisi !== null) return;
        if (annule) { resoudre(null); return; }
        const x0 = await pasSession(sessions[k]);
        if (choisi !== null) return;
        peint(k, x0);
        etat.textContent = 'apercus ' + (pas * 5 + k + 1) + ' / ' + (5 * APERCU) +
                           ' — touche une image quand tu veux';
        await attendreImage();
      }
    }
    while (choisi === null && !annule) await attendreImage();
    if (annule) resoudre(null);
  })();

  return attente;
}

// ---------- controles ----------
$('etapes').oninput = () => {
  $('etapesVal').textContent = $('etapes').value;
  if (!enCours) etat.textContent = 'estimation ' + ($('etapes').value * SEC).toFixed(0) + ' s';
};
$('influence').oninput = () => { $('influenceVal').textContent = $('influence').value; };
$('de').onclick = () => { $('graine').value = (Math.random() * 1e9) | 0; };

function optionsCourantes() {
  const g = $('graine').value.trim();
  return {
    H: S, W: S,
    etapes: +$('etapes').value,
    theme: $('theme').value,
    influence: (+$('influence').value / 100) * FORCE_MAX,
    graine: g === '' ? null : (+g | 0),
  };
}

$('go').onclick = async () => {
  if (enCours) { annule = true; enPause = false; await attendreImage(); await attendreImage(); }
  annule = false; agrandie = false;
  const opts = optionsCourantes();
  try {
    if ($('multi').checked) {
      enCours = true; majBoutons();
      const s = await phaseCandidats(opts);
      enCours = false;
      if (!s) { majBoutons(); return; }
      session = s;
    } else {
      session = creeSession(opts);
    }
    await derouler(session);
  } catch (e) {
    etat.textContent = 'ERREUR : ' + e.message;
    enCours = false; majBoutons();
  }
};

$('pause').onclick = async () => {
  // en cours -> pause
  if (enCours && !enPause) {
    enPause = true;
    majBoutons();
    etat.textContent = 'en pause au pas ' + session.i + ' / ' + session.suite.length;
    return;
  }
  // en pause -> reprise avec le nombre d'etapes restantes
  if (enCours && enPause) {
    replanifie(session, Math.max(2, +$('etapes').value - session.fait));
    enPause = false;
    majBoutons();
    return;
  }
  // rien en cours -> on raffine l'image affichee
  if (!derniere || agrandie) return;
  session = creeSession({
    H: dernH, W: dernW,
    etapes: +$('etapes').value,
    depart: derniere,
    tDepart: T_REPRISE,
  });
  await derouler(session, 'reprise');
};

$('up').onclick = async () => {
  if (enCours || !derniere || agrandie) return;
  enCours = true; majBoutons();
  etat.textContent = 'agrandissement...';
  await attendreImage();
  const t0 = performance.now();
  try {
    const n = derniere.length;
    const src = new Float32Array(n);
    for (let k = 0; k < n; k++) src[k] = (derniere[k] + 1) * 0.5;
    const bx = bufTemp(src);
    debutLot();
    const r = agrandisSR(bx, dernH, dernW);
    finLot();
    const grand = await lire(r.buf, r.C * r.H * r.W);
    libereTemp(null);
    dessine(grand, r.H, r.W, 'unite');
    agrandie = true;
    etat.textContent = r.W + '×' + r.H + ' en ' +
      ((performance.now() - t0) / 1000).toFixed(1) + ' s';
  } catch (e) {
    etat.textContent = 'ERREUR : ' + e.message;
  }
  enCours = false; majBoutons();
};

$('save').onclick = () => {
  // toDataURL est synchrone : le lien avec le geste utilisateur est preserve,
  // sinon Safari iOS bloque le telechargement
  const a = document.createElement('a');
  a.href = hors.toDataURL('image/png');
  a.download = 'paysage_' + Date.now() + '.png';
  a.click();
};

// ---------- demarrage ----------
(async () => {
  const mo = (o) => (o / 1048576).toFixed(1);
  const barre = (etiquette) => (recu, total) => {
    etat.textContent = etiquette + ' ' + mo(recu) + ' / ' + mo(total) + ' Mo';
  };

  try {
    if (!navigator.gpu) {
      etat.textContent =
        "Ce navigateur ne gere pas WebGPU. Essaie Chrome, ou Safari sur iOS 18 et plus " +
        "(Reglages > Apps > Safari > Avance > Fonctionnalites experimentales > WebGPU).";
      return;
    }
    await initGPU();

    await chargeVariante('ema', 'poids_ema', barre('chargement du modele'));
    choisitVariante('ema');
    S = ARCHI.taille;

    hors = document.createElement('canvas');
    hors.width = S; hors.height = S;
    hctx = hors.getContext('2d');

    if (!ABAR) ABAR = calendrier(ARCHI.T);
    derniere = randn(3 * S * S, Math.random);
    dernH = S; dernW = S;
    dessine(derniere, S, S, 'signe');

    await chargePoidsSR(barre("chargement de l'agrandisseur"));

    majBoutons();
    etat.textContent = 'pret — estimation ' + ($('etapes').value * SEC).toFixed(0) + ' s';
  } catch (e) {
    etat.textContent = 'ERREUR : ' + e.message;
  }
})();
</script>
</body>
</html>

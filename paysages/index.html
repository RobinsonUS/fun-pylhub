<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paysages infinis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #fdf8f0;
    --encre: #1f1b16;
    --gris: #6b625a;
    --trait: #1f1b16;
    --accent: #e8792b;
    --jaune: #ffe9a8;
    --ombre: 5px 5px 0 var(--trait);
    --ombre-p: 3px 3px 0 var(--trait);
  }

  * { box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--fond);
    background-image:
      radial-gradient(circle at 12% 14%, rgba(255, 206, 122, .34), transparent 44%),
      radial-gradient(circle at 88% 8%,  rgba(140, 200, 255, .30), transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(190, 245, 200, .28), transparent 46%);
    background-attachment: fixed;
    color: var(--encre);
    font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding: 34px 18px 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .page { width: 100%; max-width: 560px; }

  h1 {
    font-size: clamp(30px, 8vw, 42px);
    font-weight: 700;
    letter-spacing: -.03em;
    line-height: 1.05;
    text-align: center;
  }
  h1 em { font-style: normal; color: var(--accent); }

  .sous {
    margin: 10px 0 26px;
    text-align: center;
    font-size: 15px;
    font-weight: 400;
    color: var(--gris);
    line-height: 1.5;
  }

  /* ---------- image ---------- */
  .cadre {
    background: #efe7db;
    border: 4px solid var(--trait);
    border-radius: 22px;
    box-shadow: var(--ombre);
    overflow: hidden;
    line-height: 0;
  }
  #vue { display: block; width: 100%; image-rendering: pixelated; }

  /* ---------- vignettes candidates ---------- */
  #choix {
    display: none;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 16px;
  }
  #choix canvas {
    width: 86px; height: 86px;
    image-rendering: pixelated;
    border: 3px solid var(--trait);
    border-radius: 14px;
    box-shadow: var(--ombre-p);
    cursor: pointer;
    transition: transform .15s ease;
  }
  #choix canvas:active { transform: translate(-2px, -2px) scale(1.04); }

  /* ---------- etat ---------- */
  #etat {
    margin-top: 16px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    color: var(--gris);
    font-variant-numeric: tabular-nums;
    min-height: 1.5em;
    line-height: 1.4;
  }

  /* ---------- panneau de reglages ---------- */
  .panneau {
    margin-top: 22px;
    background: #fff;
    border: 4px solid var(--trait);
    border-radius: 22px;
    box-shadow: var(--ombre);
    padding: 20px 20px 22px;
  }

  .champ { margin-bottom: 20px; }
  .champ:last-child { margin-bottom: 0; }

  .etiquette {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--gris);
    margin-bottom: 9px;
  }
  .etiquette output {
    font-size: 15px;
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
    color: var(--encre);
    background: var(--jaune);
    border: 2px solid var(--trait);
    border-radius: 999px;
    padding: 1px 10px;
  }

  /* curseurs */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 12px; background: #f0e9dd;
    border: 2.5px solid var(--trait); border-radius: 999px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 26px; height: 26px; margin-top: -9.5px;
    background: var(--accent);
    border: 2.5px solid var(--trait); border-radius: 50%;
  }
  input[type=range]::-moz-range-track {
    height: 12px; background: #f0e9dd;
    border: 2.5px solid var(--trait); border-radius: 999px;
  }
  input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px;
    background: var(--accent);
    border: 2.5px solid var(--trait); border-radius: 50%;
  }
  input[type=range]:disabled { opacity: .4; }

  /* liste deroulante */
  select {
    -webkit-appearance: none; appearance: none;
    width: 100%;
    font: 500 16px 'Fredoka', system-ui, sans-serif;
    color: var(--encre);
    background: #fff;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--encre) 50%),
      linear-gradient(135deg, var(--encre) 50%, transparent 50%);
    background-position: calc(100% - 20px) 21px, calc(100% - 14px) 21px;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
    border: 3px solid var(--trait);
    border-radius: 14px;
    padding: 12px 44px 12px 14px;
    min-height: 48px;
  }
  select:disabled { opacity: .45; }

  /* case a cocher */
  .bascule {
    display: flex; align-items: center; gap: 11px;
    font-size: 15px; font-weight: 500;
    cursor: pointer; user-select: none;
  }
  .bascule input { position: absolute; opacity: 0; pointer-events: none; }
  .boite {
    width: 26px; height: 26px; flex: none;
    background: #fff;
    border: 3px solid var(--trait);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .boite::after {
    content: ''; width: 12px; height: 7px;
    border-left: 3.5px solid var(--trait);
    border-bottom: 3.5px solid var(--trait);
    transform: rotate(-45deg) translate(1px, -2px) scale(0);
    transition: transform .14s ease;
  }
  .bascule input:checked + .boite { background: var(--jaune); }
  .bascule input:checked + .boite::after { transform: rotate(-45deg) translate(1px, -2px) scale(1); }
  .bascule input:disabled + .boite { opacity: .4; }

  /* boutons */
  .rangee { display: flex; gap: 12px; margin-top: 14px; }
  .rangee button { flex: 1; }

  button {
    font: 600 16px 'Fredoka', system-ui, sans-serif;
    color: var(--encre);
    background: #fff;
    border: 3px solid var(--trait);
    border-radius: 14px;
    box-shadow: var(--ombre-p);
    padding: 13px 14px;
    min-height: 50px;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:active:not(:disabled) {
    transform: translate(3px, 3px);
    box-shadow: 0 0 0 var(--trait);
  }
  button:disabled { opacity: .35; box-shadow: none; cursor: default; }
  button.principal { background: var(--accent); color: #fff; }
  button.doux { background: var(--jaune); }

  @media (max-width: 400px) {
    body { padding: 26px 14px 56px; }
    .panneau { padding: 17px; }
    button { font-size: 15px; padding: 12px 10px; }
  }
</style>
</head>
<body>

<div class="page">

  <h1>Paysages <em>infinis</em></h1>
  <p class="sous">
    Un réseau de neurones qui dessine des lieux<br>
    n'ayant jamais existé, sur votre appareil.
  </p>

  <div class="cadre"><canvas id="vue"></canvas></div>

  <div id="choix"></div>

  <div id="etat">chargement...</div>

  <div class="panneau">

    <div class="champ">
      <div class="etiquette"><span>Thème</span></div>
      <select id="theme">
        <option value="aucun" selected>Aucun, laisser faire le hasard</option>
        <option value="foret">Forêt</option>
        <option value="montagne">Montagne</option>
        <option value="desert">Désert</option>
        <option value="ocean">Océan</option>
        <option value="coucher">Coucher de soleil</option>
        <option value="neige">Neige</option>
        <option value="nuit">Nuit</option>
        <option value="prairie">Prairie</option>
      </select>
    </div>

    <div class="champ">
      <div class="etiquette">
        <span>Influence du thème</span>
        <output id="influenceVal">30</output>
      </div>
      <input type="range" id="influence" min="0" max="100" value="30">
    </div>

    <div class="champ">
      <div class="etiquette">
        <span>Étapes de débruitage</span>
        <output id="etapesVal">50</output>
      </div>
      <input type="range" id="etapes" min="10" max="200" value="50">
    </div>

    <div class="champ">
      <label class="bascule">
        <input type="checkbox" id="multi">
        <span class="boite"></span>
        <span>Proposer 5 départs au choix</span>
      </label>
    </div>

    <div class="rangee">
      <button id="go" class="principal">Générer</button>
      <button id="pause" class="doux">Reprendre</button>
    </div>

    <div class="rangee">
      <button id="up" disabled>Agrandir ×4</button>
      <button id="save" disabled>Enregistrer</button>
    </div>

  </div>

</div>

<script src="js/poids.js"></script>
<script src="js/gpu.js"></script>
<script src="js/couches.js"></script>
<script src="js/echantillon.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const vue = $('vue'), ctx = vue.getContext('2d');
const etat = $('etat'), zoneChoix = $('choix');

let hors, hctx;
let S = 128;
let session = null;
let derniere = null, dernH = 128, dernW = 128;
let enCours = false, enPause = false, annule = false;
let agrandie = false;

const SEC = 3.3;
const APERCU = 3;        // etapes generees pour chaque candidat
const T_REPRISE = 400;   // instant de rebruitage lors d'une reprise
const FORCE_MAX = 1.0;

// ---------- affichage ----------
function dessine(tab, H, W, plage) {
  if (hors.width !== W || hors.height !== H) { hors.width = W; hors.height = H; }
  const img = hctx.createImageData(W, H);
  const hw = H * W;
  const a = (plage === 'unite') ? 255 : 127.5;
  const b = (plage === 'unite') ? 0 : 127.5;
  for (let i = 0; i < hw; i++) {
    img.data[i * 4]     = tab[i] * a + b;
    img.data[i * 4 + 1] = tab[hw + i] * a + b;
    img.data[i * 4 + 2] = tab[2 * hw + i] * a + b;
    img.data[i * 4 + 3] = 255;
  }
  hctx.putImageData(img, 0, 0);
  const larg = vue.clientWidth;
  const haut = Math.round(larg * H / W);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  vue.width = Math.round(larg * dpr);
  vue.height = Math.round(haut * dpr);
  vue.style.height = haut + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(hors, 0, 0, larg, haut);
}

function attendreImage() { return new Promise(r => requestAnimationFrame(r)); }

function majBoutons() {
  const occupe = enCours && !enPause;
  $('go').disabled = false;
  $('theme').disabled = occupe;
  $('multi').disabled = occupe;
  $('influence').disabled = occupe;

  $('pause').textContent = occupe ? 'Pause' : 'Reprendre';
  $('pause').disabled = agrandie || !derniere;

  $('up').disabled   = enCours || !derniere || agrandie;
  $('save').disabled = enCours || !derniere;
}

// ---------- boucle ----------
async function derouler(s, etiquette) {
  enCours = true; enPause = false; agrandie = false;
  majBoutons();
  const t0 = performance.now();

  while (!sessionFinie(s) && !annule) {
    if (enPause) { await attendreImage(); continue; }
    const x0 = await pasSession(s);
    derniere = x0; dernH = s.H; dernW = s.W;
    dessine(x0, s.H, s.W, 'signe');
    etat.textContent = (etiquette ? etiquette + ' · ' : '') +
      'étape ' + s.i + ' / ' + s.suite.length +
      '   ·   ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s';
    await attendreImage();
  }

  enCours = false; enPause = false;
  majBoutons();
  if (sessionFinie(s) && !annule)
    etat.textContent = 'terminé en ' +
      ((performance.now() - t0) / 1000).toFixed(1) + ' s';
  annule = false;
}

// ---------- candidats ----------
async function phaseCandidats(opts) {
  zoneChoix.style.display = 'flex';
  zoneChoix.innerHTML = '';
  const sessions = [], toiles = [];
  let choisi = null, resoudre;
  const attente = new Promise(r => { resoudre = r; });

  const peint = (k, tab) => {
    toiles[k].getContext('2d').putImageData(
      new ImageData(versPixels(tab, opts.H, opts.W), opts.W, opts.H), 0, 0);
  };

  for (let k = 0; k < 5; k++) {
    const c = document.createElement('canvas');
    c.width = opts.W; c.height = opts.H;
    c.onclick = () => {
      if (choisi !== null) return;
      choisi = k;
      zoneChoix.style.display = 'none';
      zoneChoix.innerHTML = '';
      resoudre(sessions[k]);
    };
    zoneChoix.appendChild(c);
    toiles.push(c);
    sessions.push(creeSession({ ...opts, graine: (Math.random() * 1e9) | 0 }));
  }

  // on affiche le bruit de depart : les vignettes sont cliquables tout de suite
  for (let k = 0; k < 5; k++) peint(k, sessions[k].x);
  etat.textContent = 'touchez une image quand elle vous plaît';

  (async () => {
    for (let pas = 0; pas < APERCU; pas++) {
      for (let k = 0; k < 5; k++) {
        if (choisi !== null) return;
        if (annule) { resoudre(null); return; }
        const x0 = await pasSession(sessions[k]);
        if (choisi !== null) return;
        peint(k, x0);
        etat.textContent = 'aperçus ' + (pas * 5 + k + 1) + ' / ' + (5 * APERCU) +
                           '   ·   touchez une image quand elle vous plaît';
        await attendreImage();
      }
    }
    while (choisi === null && !annule) await attendreImage();
    if (annule) resoudre(null);
  })();

  return attente;
}

// ---------- controles ----------
$('etapes').oninput = () => {
  $('etapesVal').textContent = $('etapes').value;
  if (!enCours) etat.textContent = 'environ ' +
    ($('etapes').value * SEC).toFixed(0) + ' s par image';
};
$('influence').oninput = () => { $('influenceVal').textContent = $('influence').value; };

function optionsCourantes() {
  return {
    H: S, W: S,
    etapes: +$('etapes').value,
    theme: $('theme').value,
    influence: (+$('influence').value / 100) * FORCE_MAX,
    graine: null,
  };
}

$('go').onclick = async () => {
  if (enCours) { annule = true; enPause = false; await attendreImage(); await attendreImage(); }
  annule = false; agrandie = false;
  const opts = optionsCourantes();
  try {
    if ($('multi').checked) {
      enCours = true; majBoutons();
      const s = await phaseCandidats(opts);
      enCours = false;
      if (!s) { majBoutons(); return; }
      session = s;
    } else {
      session = creeSession(opts);
    }
    await derouler(session);
  } catch (e) {
    etat.textContent = 'ERREUR : ' + e.message;
    enCours = false; majBoutons();
  }
};

$('pause').onclick = async () => {
  // en cours -> pause
  if (enCours && !enPause) {
    enPause = true;
    majBoutons();
    etat.textContent = 'en pause à l\'étape ' + session.i + ' / ' + session.suite.length;
    return;
  }
  // en pause -> reprise avec le nombre d'etapes restantes
  if (enCours && enPause) {
    replanifie(session, Math.max(2, +$('etapes').value - session.fait));
    enPause = false;
    majBoutons();
    return;
  }
  // rien en cours -> on raffine l'image affichee
  if (!derniere || agrandie) return;
  session = creeSession({
    H: dernH, W: dernW,
    etapes: +$('etapes').value,
    depart: derniere,
    tDepart: T_REPRISE,
  });
  await derouler(session, 'reprise');
};

$('up').onclick = async () => {
  if (enCours || !derniere || agrandie) return;
  enCours = true; majBoutons();
  etat.textContent = 'agrandissement en cours...';
  await attendreImage();
  const t0 = performance.now();
  try {
    const n = derniere.length;
    const src = new Float32Array(n);
    for (let k = 0; k < n; k++) src[k] = (derniere[k] + 1) * 0.5;
    const bx = bufTemp(src);
    debutLot();
    const r = agrandisSR(bx, dernH, dernW);
    finLot();
    const grand = await lire(r.buf, r.C * r.H * r.W);
    libereTemp(null);
    dessine(grand, r.H, r.W, 'unite');
    agrandie = true;
    etat.textContent = r.W + ' × ' + r.H + ' en ' +
      ((performance.now() - t0) / 1000).toFixed(1) + ' s';
  } catch (e) {
    etat.textContent = 'ERREUR : ' + e.message;
  }
  enCours = false; majBoutons();
};

$('save').onclick = () => {
  // toDataURL est synchrone : le lien avec le geste utilisateur est preserve,
  // sinon Safari iOS bloque le telechargement
  const a = document.createElement('a');
  a.href = hors.toDataURL('image/png');
  a.download = 'paysage_' + Date.now() + '.png';
  a.click();
};

// ---------- demarrage ----------
(async () => {
  const mo = (o) => (o / 1048576).toFixed(1);
  const barre = (etiquette) => (recu, total) => {
    etat.textContent = etiquette + '   ' + mo(recu) + ' / ' + mo(total) + ' Mo';
  };

  try {
    if (!navigator.gpu) {
      etat.textContent =
        "Ce navigateur ne gère pas WebGPU. Essayez Chrome, ou Safari sur iOS 18 et plus.";
      return;
    }
    await initGPU();

    await chargeVariante('ema', 'poids_ema', barre('chargement du modèle'));
    choisitVariante('ema');
    S = ARCHI.taille;

    hors = document.createElement('canvas');
    hors.width = S; hors.height = S;
    hctx = hors.getContext('2d');

    if (!ABAR) ABAR = calendrier(ARCHI.T);
    derniere = randn(3 * S * S, Math.random);
    dernH = S; dernW = S;
    dessine(derniere, S, S, 'signe');

    await chargePoidsSR(barre("chargement de l'agrandisseur"));

    majBoutons();
    etat.textContent = 'prêt · environ ' +
      ($('etapes').value * SEC).toFixed(0) + ' s par image';
  } catch (e) {
    etat.textContent = 'ERREUR : ' + e.message;
  }
})();
</script>
</body>
</html>
